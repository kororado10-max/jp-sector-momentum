name: Daily JP Sector Momentum

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bundle/chunk*.txt'
      - 'workflow/yahoo_provider.py'
      - '.github/workflows/daily-pages.yml'
  schedule:
    # 17:45 JST on weekdays.
    - cron: '45 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract application source
        shell: bash
        run: |
          cat bundle/chunk*.txt > project.b64
          base64 --decode project.b64 > project.tar.xz
          echo '7d5e21007b963677b15fc401fda650a68ce7f86e00afcdf83cc86570a1fd901c  project.tar.xz' | sha256sum -c -
          tar -xJf project.tar.xz

      - name: Install Yahoo Finance EOD provider
        run: cp workflow/yahoo_provider.py backend/app/providers/stooq_provider.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Restore price cache
        uses: actions/cache/restore@v5
        with:
          path: |
            backend/data/prices.csv
            backend/data/update_status.json
            backend/data/failed_symbols.txt
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Provider smoke test
        working-directory: backend
        run: |
          PYTHONPATH=. python - <<'PY'
          import asyncio
          from datetime import date, timedelta
          from app.providers.stooq_provider import fetch_symbol, parse_stooq_csv

          legacy = parse_stooq_csv(
              'Date,Open,High,Low,Close,Volume\n2026-08-07,100,105,99,104,123456\n',
              '7203',
          )
          assert legacy.iloc[0]['code'] == '7203'

          end = date.today()
          start = end - timedelta(days=60)
          df = asyncio.run(fetch_symbol('7203', start.isoformat(), end.isoformat()))
          print('Yahoo smoke rows=', len(df), 'latest=', df['date'].max())
          assert len(df) >= 10
          PY

      - name: Refresh EOD data
        working-directory: backend
        run: PYTHONPATH=. python scripts/update_data.py --concurrency 6

      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q

      - name: Export static API
        working-directory: backend
        run: PYTHONPATH=. python scripts/export_static.py --output ../public

      - name: Verify static bundle
        working-directory: backend
        run: PYTHONPATH=. python scripts/verify_static.py --root ../public

      - name: Save price cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            backend/data/prices.csv
            backend/data/update_status.json
            backend/data/failed_symbols.txt
          key: market-data-${{ github.run_id }}

      - name: Publish static API branch
        shell: bash
        run: |
          rm -rf /tmp/jpsm-public
          cp -a public /tmp/jpsm-public

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan api-data
          git rm -rf . || true
          git clean -fdx
          cp -a /tmp/jpsm-public/. .
          touch .nojekyll
          git add -A
          git commit -m "Update market data ${GITHUB_RUN_ID}"
          git push --force origin api-data

      - name: Verify published endpoint
        shell: bash
        run: |
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/api-data"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "${base}/metadata.json?run=${GITHUB_RUN_ID}" -o /tmp/metadata.json; then
              python - <<'PY'
          import json
          data = json.load(open('/tmp/metadata.json', encoding='utf-8'))
          print('published metadata:', data)
          assert data.get('as_of')
          assert data.get('sector_count') == 33
          PY
              exit 0
            fi
            sleep 5
          done
          echo 'Published raw endpoint did not become available' >&2
          exit 1
