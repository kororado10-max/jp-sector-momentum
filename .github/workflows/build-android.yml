name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bundle/stage5-*.b64'
      - 'workflow/sector_stage5.dart'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Stage 5 application source
        shell: bash
        run: |
          cat bundle/stage5-*.b64 > project.b64
          base64 --decode project.b64 > project.tar.xz
          echo '4f6f775c652d18f13df7d8d8252086fe82675194bb500b90154088a22034bb39  project.tar.xz' | sha256sum -c -
          tar -xJf project.tar.xz
          cp workflow/sector_stage5.dart mobile/lib/models/sector.dart

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve static API URL
        id: api
        shell: bash
        run: |
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/api-data" >> "$GITHUB_OUTPUT"

      - name: Create Android scaffold
        working-directory: mobile
        shell: bash
        run: |
          flutter create --platforms=android --project-name jp_sector_momentum .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET" />'
          if perm not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + perm,
              )
          manifest.write_text(text)
          PY
          flutter pub get

      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ steps.api.outputs.url }}
        run: |
          flutter build apk --release \
            --dart-define=STATIC_API=true \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: jp-sector-momentum-stage5-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
